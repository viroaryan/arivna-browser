[package]
name = "arivna_shield"
version = "1.0.0"
edition = "2021"
description = "Arivna Shield: a from-scratch, uBlock Origin-compatible content blocking engine for Android WebView."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
jni-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
